name: Elixir CI
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write

var:
  elixir-cache-path: |
    deps
    .nix_hex
    .nix_mix

jobs:
  check:
    name: Compiles without warning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - uses: nicknovitski/nix-develop@v1
      - uses: Swatinem/rust-cache@v2
      - uses: actions/cache@v6
        with:
          path: ${{ var.elixir-cache-path }}
          key: check-elixir-cache
      - run: make elixir-setup
      - run: make elixir-check

  formatted:
    name: Check Formatted
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - uses: nicknovitski/nix-develop@v1
      - uses: Swatinem/rust-cache@v2
      - uses: actions/cache@v6
        with:
          path: ${{ var.elixir-cache-path }}
          key: formatted-elixir-cache
      - run: make elixir-setup
      - run: make elixir-formatted

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - uses: nicknovitski/nix-develop@v1
      - uses: Swatinem/rust-cache@v2
      - uses: actions/cache@v6
        with:
          path: ${{ var.elixir-cache-path }}
          key: test-elixir-cache
      - run: make elixir-setup
      - run: make elixir-test
