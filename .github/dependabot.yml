version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    commit-message:
      prefix: "chore: "
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "daily"
    commit-message:
      prefix: "chore: "
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
  - package-ecosystem: "hex"
    directory: "/"
    schedule:
      interval: "daily"
    commit-message:
      prefix: "chore: "
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
